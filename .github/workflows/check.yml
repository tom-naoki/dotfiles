name: Setup scripts

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check Bash syntax
        run: |
          for script in install.sh zsh/setup-oh-my-zsh.sh tests/install-smoke.sh; do
            bash -n "$script"
          done
      - name: Verify setup with isolated HOME and stub commands
        run: bash tests/install-smoke.sh
